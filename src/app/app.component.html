<RadSideDrawer [drawerTransition]="sideDrawerTransition">
  <GridLayout tkDrawerContent rows="auto, *" class="nt-drawer__content">
    <StackLayout row="0" class="sidedrawer-header">
      <Image src="res://ic_catalogo_custom" width="48" height="48" horizontalAlignment="left"></Image>
      <Label class="sidedrawer-header-brand" text="NativeScript + Redux"></Label>
      <Label class="sidedrawer-header-footnote" text="Express API & AppSettings"></Label>
    </StackLayout>

    <ScrollView row="1" class="nt-drawer__body">
      <StackLayout>
        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/home')" (tap)="onNavItemTap('/home')">
          <Label col="0" text="&#xf015;" class="nt-icon fas"></Label>
          <Label col="1" text="Home (Leer Ahora - Redux)" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/search')" (tap)="onNavItemTap('/search')">
          <Label col="0" text="&#xf002;" class="nt-icon fas"></Label>
          <Label col="1" text="Búsqueda (API Express)" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/favoritos')" (tap)="onNavItemTap('/favoritos')">
          <Label col="0" text="&#xf005;" class="nt-icon fas"></Label>
          <Label col="1" text="Favoritos" class="p-r-10"></Label>
        </GridLayout>

        <StackLayout class="hr m-y-10"></StackLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/settings')" (tap)="onNavItemTap('/settings')">
          <Label col="0" text="&#xf013;" class="nt-icon fas"></Label>
          <Label col="1" text="Settings (Usuario & Ngrok)" class="p-r-10"></Label>
        </GridLayout>
      </StackLayout>
    </ScrollView>
  </GridLayout>

  <page-router-outlet tkMainContent></page-router-outlet>
</RadSideDrawer>
